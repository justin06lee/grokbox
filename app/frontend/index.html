<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>grokbox</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="side-head">
        <div class="brand">grokbox</div>
        <button id="add-room" class="icon-btn" title="Join a room" aria-label="Join a room">+</button>
      </header>
      <nav id="rooms" class="rooms"></nav>
      <footer class="side-foot"><span id="version"></span></footer>
    </aside>

    <main id="main">
      <header id="room-head" class="room-head" hidden>
        <div class="room-head-text">
          <h1 id="room-name"></h1>
          <p id="room-sub"></p>
        </div>
        <button id="members-btn" class="ghost-btn" title="Who is in the room">Members</button>
      </header>

      <section id="stream" class="stream"></section>

      <div id="empty" class="empty">
        <div class="empty-art" aria-hidden="true">
          <img src="/crate.svg" alt="" width="140" height="140" />
        </div>
        <h2>No rooms yet</h2>
        <p>Somebody with a room will have sent you an invite code. Paste it in and you are in.</p>
        <button id="empty-join" class="primary-btn">Paste an invite code</button>
      </div>

      <form id="composer" class="composer" hidden>
        <textarea id="input" rows="1" placeholder="Write a message…" autocomplete="off" spellcheck="true"></textarea>
        <button id="send" type="submit" class="send-btn" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.2 20.5 21 12 3.2 3.5l.1 6.6L15 12 3.3 13.9z" fill="currentColor"/></svg>
        </button>
      </form>
    </main>

    <aside id="members" class="members" hidden>
      <header class="members-head">Members</header>
      <ul id="member-list"></ul>
    </aside>
  </div>

  <div id="modal" class="modal" hidden>
    <form class="sheet" id="join-form">
      <h2>Join a room</h2>
      <p class="sheet-note">The invite carries the server, the room, the key and the hash of its certificate. Paste the whole thing.</p>
      <label for="invite">Invite code</label>
      <textarea id="invite" rows="3" spellcheck="false" placeholder="grokbox1-…"></textarea>
      <label for="join-name">Your name in the room</label>
      <input id="join-name" type="text" spellcheck="false" placeholder="justin" />
      <p id="join-error" class="sheet-error" hidden></p>
      <div class="sheet-actions">
        <button type="button" id="join-cancel" class="ghost-btn">Cancel</button>
        <button type="submit" id="join-go" class="primary-btn">Join</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
